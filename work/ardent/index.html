<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>The Ardent Residences · Owner portal (demo)</title>
<meta name="description" content="A sample condo owner portal built by Torall Ventures: news, amenity booking, voting, maintenance requests, a buying center and feedback.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A2540;--ink2:#14385E;--sea:#0E9F8E;--seal:#DDF3EE;--coral:#FF5C7A;--coralL:#FFE3E8;--sun:#FFC24B;--bg:#F2F7F6;--card:#fff;--mut:#5B7083;--ln:#DCE7E5;--d:'Unbounded',system-ui,sans-serif;--b:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{-webkit-text-size-adjust:100%}
body{font:500 15px/1.55 var(--b);color:var(--ink);background:var(--bg);min-height:100vh}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}svg{display:block}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
h1,h2,h3{font-family:var(--d);font-weight:500;letter-spacing:-.02em;line-height:1.1}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
/* rail */
.rail{position:sticky;top:0;height:100vh;padding:18px;display:flex}
.rail>div{flex:1;background:var(--ink);color:#d7e6ee;border-radius:30px;padding:22px 14px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.rail>div::after{content:"";position:absolute;left:-40%;right:-40%;bottom:-120px;height:260px;background:radial-gradient(closest-side,rgba(14,159,142,.45),transparent);pointer-events:none}
.logo{display:flex;align-items:center;gap:12px;padding:0 10px 22px}.logo svg{width:38px;height:38px}.logo b{font:500 17px var(--d);color:#fff;letter-spacing:-.02em;display:block;line-height:1}.logo small{font-size:12px;color:#8fb0c4}
.nv{position:relative;display:flex;flex-direction:column;gap:2px}.nv a{position:relative;z-index:1;display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:16px;font-weight:600;color:#a8c3d3;transition:color .25s}
.nv a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.nv a:hover{color:#fff}.nv a.on{color:var(--ink)}
.nv a .ct{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;transition:transform .3s}
.pill{position:absolute;left:0;right:0;top:0;height:46px;background:var(--seal);border-radius:16px;transition:transform .45s cubic-bezier(.3,1.3,.5,1);z-index:0}
.me{margin-top:auto;position:relative;z-index:1;background:rgba(255,255,255,.07);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--coral));display:grid;place-items:center;font:700 14px var(--d);color:var(--ink);flex:none}
.me b{display:block;color:#fff;font-size:14px}.me small{color:#8fb0c4}
.by{position:relative;z-index:1;margin:12px 6px 0;font-size:12px;color:#7f9db0}.by a{color:#cfe9f2;text-decoration:underline;text-underline-offset:3px}
/* main */
main{padding:22px 30px 60px;min-width:0}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sun);color:#3b2a00;border-radius:14px;padding:9px 16px;font-size:13px;font-weight:600;margin-bottom:20px}.demo a{text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}.top h1{font-size:clamp(26px,3.2vw,38px)}.top p{color:var(--mut);margin-top:6px}
.sp{margin-left:auto}.ib{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--ln);display:grid;place-items:center;transition:transform .2s}.ib:hover{transform:translateY(-2px)}.ib svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ib i{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.pg{display:none}.pg.on{display:block;animation:pgi .4s ease both}@keyframes pgi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:13px 22px;background:var(--ink);color:#fff;font-weight:700;transition:transform .2s,background .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(10,37,64,.22)}.btn:active{transform:scale(.97)}
.btn.sea{background:var(--sea)}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600;font-size:14px;transition:.2s}.chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mut{color:var(--mut)}.sm{font-size:13px}
/* home */
.hero{position:relative;border-radius:34px;overflow:hidden;min-height:360px;color:#fff;isolation:isolate}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(rgba(8,18,40,.5),transparent 62%);pointer-events:none}.hero .ht{z-index:1;padding:32px 34px;max-width:560px;position:relative}.hero h2{font-size:clamp(28px,4vw,48px);text-shadow:0 2px 24px rgba(0,0,0,.25)}.hero p{margin-top:12px;max-width:42ch;text-shadow:0 1px 12px rgba(0,0,0,.3)}
.hero .qa{position:absolute;left:24px;right:24px;bottom:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa a{display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:18px;background:rgba(10,37,64,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:700;font-size:14px;transition:background .25s,transform .25s}.qa a:hover{background:rgba(10,37,64,.8);transform:translateY(-3px)}.qa svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g{display:grid;gap:18px;margin-top:18px}.g.h{grid-template-columns:1.25fr 1fr}.g.st{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;flex-direction:column;gap:2px}.stat b{font:500 clamp(30px,3.6vw,46px)/1 var(--d);letter-spacing:-.03em}.stat span{color:var(--mut);font-weight:600}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}.row:first-child{border-top:0;padding-top:0}.row .tm{width:62px;flex:none;font:500 13px var(--d);color:var(--sea)}.row b{display:block}
.sts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.sts span{display:inline-flex;gap:8px;align-items:center;background:var(--seal);padding:7px 13px;border-radius:99px;font-weight:600;font-size:13px}.sts span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sea);animation:pl 2s infinite}.sts span.w{background:#FFF1D1}.sts span.w::before{background:#E69B00}
@keyframes pl{50%{opacity:.35}}
h3.sec{font-size:19px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}h3.sec a{font:600 13px var(--b);color:var(--sea);letter-spacing:0}
/* news */
.feat{display:grid;grid-template-columns:1.1fr 1fr;border-radius:28px;overflow:hidden;background:var(--ink);color:#fff;min-height:300px}.feat .im{background:linear-gradient(140deg,#0E9F8E,#0A2540);position:relative;overflow:hidden}.feat .im em{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-style:normal;animation:fl 6s ease-in-out infinite}.feat .tx{padding:32px;display:flex;flex-direction:column;gap:12px;justify-content:center}.feat h2{font-size:clamp(24px,2.6vw,34px)}.feat p{color:#b9d0de}.tag{align-self:flex-start;background:var(--sun);color:#3b2a00;font-weight:700;font-size:12px;padding:4px 11px;border-radius:99px}
@keyframes fl{50%{transform:translateY(-10px) rotate(3deg)}}
.nl{margin-top:18px;display:grid;gap:12px}.nw{background:#fff;border:1px solid var(--ln);border-radius:20px;overflow:hidden}.nw button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;gap:16px;align-items:center;padding:16px 20px}.nw .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}.nw h4{font:700 16px var(--b)}.nw .d{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;flex:none}.nw .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}.nw.on .bd{grid-template-rows:1fr}.nw .bd>div{overflow:hidden}.nw .bd p{padding:0 20px 18px 88px;color:var(--mut)}
/* amenities */
.am{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px}
.ac{position:relative;border-radius:26px;overflow:hidden;background:#fff;border:1px solid var(--ln);display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}.ac:hover{transform:translateY(-6px);box-shadow:0 22px 40px rgba(10,37,64,.13)}
.ac .im{height:150px;display:grid;place-items:center;position:relative;overflow:hidden}.ac .im em{font-size:64px;font-style:normal;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2));transition:transform .5s cubic-bezier(.2,.8,.2,1)}.ac:hover .im em{transform:scale(1.18) rotate(-6deg)}
.ac .im::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.5),transparent 55%)}
.ac .bd{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}.ac h3{font-size:17px}.ac .mt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.bar{height:7px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--sea);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.ac .btn{margin-top:12px;padding:11px 18px}
.mr li{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--ln)}.mr li:first-child{border-top:0}.mr .em{font-size:28px}.mr b{display:block}.mr button{margin-left:auto;background:none;border:0;color:var(--coral);font-weight:700}
.mr li.nw2{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(-10px)}}
.empty{color:var(--mut);padding:8px 0}
/* drawer */
.sc{position:fixed;inset:0;background:rgba(10,37,64,.5);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}.sc.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:61;transform:translateX(105%);transition:transform .5s cubic-bezier(.2,.9,.2,1);padding:26px;overflow:auto;display:flex;flex-direction:column;gap:16px;border-radius:30px 0 0 30px}.dr.on{transform:none}
.dr h2{font-size:24px}.x{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:20px;line-height:1}
.days{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.day{flex:none;width:62px;padding:10px 0;text-align:center;border:1.5px solid var(--ln);border-radius:18px;background:#fff;font-weight:600;transition:.2s}.day b{display:block;font:500 20px var(--d)}.day small{color:var(--mut)}.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}.day.on small{color:#9cc0d6}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{padding:12px;border:1.5px solid var(--ln);border-radius:14px;background:#fff;font-weight:600;transition:.2s}.slot:hover:not([disabled]){border-color:var(--sea)}.slot.on{background:var(--sea);border-color:var(--sea);color:#fff}.slot[disabled]{background:repeating-linear-gradient(135deg,#f3f6f6 0 6px,#e9efef 6px 12px);color:#98a8b3;text-decoration:line-through;cursor:not-allowed}
.step{display:flex;align-items:center;gap:14px}.step button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ln);background:#fff;font-size:20px}.step b{font:500 22px var(--d);min-width:30px;text-align:center}
/* voting */
.tabs{display:inline-flex;background:#fff;border:1px solid var(--ln);border-radius:99px;padding:4px;margin-bottom:18px}.tabs button{border:0;background:none;padding:10px 22px;border-radius:99px;font-weight:700;color:var(--mut);transition:.25s}.tabs button.on{background:var(--ink);color:#fff}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.vc{display:flex;flex-direction:column;gap:14px}.vc h3{font-size:20px}.vc .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}.cd{background:var(--coralL);color:#b3243f;font-weight:700;border-radius:99px;padding:4px 12px;font-variant-numeric:tabular-nums}
.op{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--ln);border-radius:16px;background:#fff;font-weight:600;overflow:hidden;transition:border-color .2s,transform .2s}.op:hover:not([disabled]){border-color:var(--ink);transform:translateX(3px)}
.op .rd{width:22px;height:22px;border-radius:50%;border:2px solid #b7c6cf;flex:none;display:grid;place-items:center;transition:.2s;position:relative;z-index:1}.op.on{border-color:var(--sea)}.op.on .rd{background:var(--sea);border-color:var(--sea)}.op.on .rd::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.op .fl{position:absolute;inset:0;width:0;background:var(--seal);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}.op span{position:relative;z-index:1}.op .pc{margin-left:auto;font:500 14px var(--d)}.op .sw{width:30px;height:30px;border-radius:9px;flex:none;position:relative;z-index:1}
.op[disabled]{cursor:default}.vc .done{display:none;align-items:center;gap:10px;color:var(--sea);font-weight:700}.vc.voted .done{display:flex;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}.vc.voted .go{display:none}
.q{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
/* maintenance */
.mg{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}.fm{display:flex;flex-direction:column;gap:16px}label.l{font-weight:700;display:block;margin-bottom:8px}
.in{width:100%;border:1.5px solid var(--ln);border-radius:16px;padding:13px 15px;font:inherit;background:#fff;color:inherit;transition:border-color .2s}.in:focus{outline:0;border-color:var(--sea)}textarea.in{resize:vertical;min-height:100px}
.seg{display:flex;background:#eef4f3;border-radius:99px;padding:4px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:99px;font-weight:700;color:var(--mut);transition:.25s}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(10,37,64,.12)}
.up{border:2px dashed #b7c6cf;border-radius:18px;padding:18px;text-align:center;color:var(--mut);transition:.2s}.up:hover{border-color:var(--sea);background:var(--seal)}
.tk{padding:18px 0;border-top:1px solid var(--ln)}.tk:first-child{border-top:0;padding-top:0}.tk h4{font:700 16px var(--b);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tk .tg{font-size:12px;background:var(--seal);color:#0b6f63;padding:3px 10px;border-radius:99px}.tk .tg.u{background:var(--coralL);color:#b3243f}
.trk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;position:relative}.trk div{font-size:12px;color:var(--mut);font-weight:600;position:relative;padding-top:16px}.trk div::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;border-radius:9px;background:var(--ln);transition:background .6s}.trk div.on::before{background:var(--sea)}.trk div.on{color:var(--ink)}
/* shop */
.sh{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:16px}.pr{background:#fff;border:1px solid var(--ln);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}.pr:hover{transform:translateY(-5px);box-shadow:0 18px 34px rgba(10,37,64,.12)}
.pr .im{height:120px;display:grid;place-items:center;font-size:52px;position:relative;overflow:hidden}.pr .im::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.55),transparent 55%)}.pr .im em{font-style:normal;position:relative;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2));transition:transform .4s}.pr:hover .im em{transform:scale(1.15) rotate(-6deg)}
.pr .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}.pr b{font-size:15px}.pr .pp{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px}.pr .pp strong{font:500 18px var(--d)}
.add{border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;padding:9px 16px;transition:.2s}.add:hover{background:var(--sea)}.add.ok{background:var(--sea)}
.fab[hidden]{display:none}.fab{position:fixed;right:26px;bottom:26px;z-index:50;height:58px;padding:0 22px 0 18px;border-radius:99px;background:var(--ink);color:#fff;border:0;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:0 14px 30px rgba(10,37,64,.35);transition:transform .25s}.fab:hover{transform:translateY(-3px)}.fab svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.fab .n{background:var(--coral);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;padding:0 6px}.fab .n.bump{animation:bm .5s}@keyframes bm{40%{transform:scale(1.5)}}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}.ci .e{font-size:30px}.ci b{display:block}.ci .q2{margin-left:auto;display:flex;align-items:center;gap:8px}.ci .q2 button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ln);background:#fff}
.tot{display:flex;justify-content:space-between;padding:6px 0}.tot.b{font:500 20px var(--d);border-top:2px solid var(--ink);padding-top:14px;margin-top:6px}
.oka{text-align:center;display:none;flex-direction:column;align-items:center;gap:12px;padding:20px 0}.oka.on{display:flex}.oka .ck{width:84px;height:84px;border-radius:50%;background:var(--sea);display:grid;place-items:center;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}.oka .ck svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dw .6s .3s forwards}@keyframes dw{to{stroke-dashoffset:0}}
/* feedback */
.stars{display:flex;gap:6px}.stars button{background:none;border:0;font-size:38px;line-height:1;filter:grayscale(1);opacity:.35;transition:transform .2s,filter .2s,opacity .2s}.stars button.on{filter:none;opacity:1}.stars button:hover{transform:scale(1.2) rotate(-8deg)}
.ig li{list-style:none;display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--ln)}.ig li:first-child{border-top:0}.ig .vt{flex:none;width:56px;border:1.5px solid var(--ln);border-radius:16px;background:#fff;padding:8px 0;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.1;transition:.2s}.ig .vt:hover{border-color:var(--sea)}.ig .vt.on{background:var(--sea);border-color:var(--sea);color:#fff}.ig .vt.pop{animation:bm .4s}.ig .vt span{font-size:11px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:90}
/* chat */
.ch{display:flex;flex-direction:column;height:min(640px,calc(100vh - 230px));min-height:420px;padding:0;overflow:hidden}.ch .hd{display:flex;gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--ln)}.bot{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--sea),var(--ink));display:grid;place-items:center}.bot svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.live{margin-left:auto;font-size:12px;font-weight:700;background:#FFF1D1;color:#8a5a00;border-radius:99px;padding:4px 12px}
.ms{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#fff,#f7fbfa)}.bb{max-width:min(520px,86%);padding:12px 16px;border-radius:20px;animation:pop .4s cubic-bezier(.3,1.4,.5,1)}.bb.b{background:#EAF4F2;border-bottom-left-radius:6px}.bb.u{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
