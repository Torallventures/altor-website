root.innerHTML=`<div class="app"><aside class="rail"><a class="lg" href="#/"><i></i>Sunday Bean</a>${AP.map(a=>`<a href="#/admin/${a[0]}" class="${p==a[0]?'on':''}">${ic(a[2])}<span>${a[1]}</span>${a[0]=='orders'&&pd?`<b class="bg2">${pd}</b>`:a[0]=='questions'&&un?`<b class="bg2">${un}</b>`:''}</a>`).join('')}<div class="me"><div class="av">RS</div><div><b>Rosa Sánchez</b><small>Owner</small></div></div><button class="lo" data-a="logout" style="margin-top:8px">Log out</button></aside><section class="ab" id="ab"></section></div>`;scrollTo(0,0);
({'':adOv,orders:adOrd,inventory:adInv,customers:adCus,statements:adStm,questions:adQ})[p]?.();chatInit()}
function head(t,s,x=''){return `<div class="dm">Demo back office. All numbers are made up. Orders and questions from the shop show up here.</div><div class="hd"><div><h1>${t}</h1><p>${s}</p></div><div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">${x}<a class="btn o sm" href="#/">View shop</a></div></div>`}
function adOv(){const m=REV[11],ch=((m/REV[10]-1)*100).toFixed(1);$('#ab').innerHTML=head('Overview','November, month to date')+`<div class="kp"><div class="k"><span>Revenue</span><b id="k1">0</b><small>▲ ${ch}% vs October</small></div><div class="k"><span>Orders</span><b id="k2">0</b><small>▲ 7.3%</small></div><div class="k"><span>Subscribers</span><b id="k3">0</b><small>▲ 35 this month</small></div><div class="k"><span>Repeat customers</span><b id="k4">0</b><small>▲ 2 pts</small></div></div><div class="gr"><div class="pn"><h3>Revenue<span class="chips"><button class="chip ${aMode=='m'?'on':''}" data-a="ch" data-m="m">12 months</button><button class="chip ${aMode=='d'?'on':''}" data-a="ch" data-m="d">30 days</button></span></h3><div id="chart"></div></div><div class="pn"><h3>Best sellers</h3><div id="top"></div></div></div><div class="gr g2"><div class="pn"><h3>Subscribers</h3><div id="sbc"></div></div><div class="pn"><h3>Sales by type</h3><div id="typ"></div></div></div>`;
count($('#k1'),m,{pre:'$'});count($('#k2'),ORN[11]+st.n);count($('#k3'),SUBS[11]);count($('#k4'),41,{suf:'%'});drawChart();hbars($('#top'),P.slice().sort((a,b)=>b.sold-a.sold).slice(0,6).map(p=>[p.n,p.sold]));bars($('#sbc'),SUBS.map((v,i)=>({l:MON[i],v})),{fmt:v=>v+' subscribers',hi:11});hbars($('#typ'),[['One-time coffee',14200],['Subscriptions',15600],['Gear',3980]],v=>money(v))}
function drawChart(){const c=$('#chart');if(!c)return;aMode=='m'?bars(c,REV.map((v,i)=>({l:MON[i],v})),{fmt:v=>money(v),hi:11}):line(c,DL,[{name:'',data:DAILY,color:'#25122F'}],{fmt:v=>money(v)})}
function adAct(a,v){if(v=='ch'){aMode=a.dataset.m;$$('.pn .chip').forEach(c=>c.classList.toggle('on',c==a));drawChart()}
else if(v=='mv'){const o=OR.find(x=>x.n==a.dataset.n),f=['Paid','Roasting','Shipped'];o.s=f[Math.min(2,f.indexOf(o.s)+1)];adOrd();toast('Order #'+o.n+' marked '+o.s.toLowerCase())}
else if(v=='ro'){const p=P.find(x=>x.id==a.dataset.i);p.st+=40;adInv();toast('Reorder placed: 40 more of '+p.n)}
else if(v=='stm')stmD(+a.dataset.i);else if(v=='pdf')toast('Demo only. In the live version this downloads a PDF.');
else if(v=='save'){const q=QS[+a.dataset.i],t=$('#ans'+a.dataset.i);if(!t.value.trim())return toast('Type an answer first');q.a=t.value.trim();q.ok=true;adQ();confetti(innerWidth/2,300,50);toast('Saved. The assistant will use this answer next time.')}
else if(v=='sug'){$('#ans'+a.dataset.i).value=a.dataset.s}}
document.addEventListener('change',e=>{if(e.target.dataset.a=='stk'){const p=P.find(x=>x.id==e.target.dataset.i);p.st=Math.max(0,+e.target.value||0);toast(p.n+': '+p.st+' in stock');adInv()}if(e.target.dataset.a=='pr'){const p=P.find(x=>x.id==e.target.dataset.i);p.p=Math.max(1,+e.target.value||p.p);toast(p.n+' is now '+money(p.p,2))}});
function adOrd(){const cols=['Paid','Roasting','Shipped'],nx={Paid:'Start roasting',Roasting:'Mark shipped'};$('#ab').innerHTML=head('Orders','Move each order along as you roast and ship.')+`<div class="kb">${cols.map(c=>{const l=OR.filter(o=>o.s==c);return `<div class="col"><h3>${c}<span>${l.length}</span></h3>${l.map(o=>`<div class="oc ${o.fresh?'nw':''}"><div class="t"><span>#${o.n} · ${o.w}</span><span>${money(o.t,2)}</span></div><div>${o.it}</div><small>${o.sub?'Subscription · ':''}${o.tm}</small>${nx[c]?`<button class="btn sm" data-a="mv" data-n="${o.n}">${nx[c]}</button>`:''}</div>`).join('')||'<p class="empty" style="padding:6px">Nothing here.</p>'}</div>`}).join('')}</div>`;OR.forEach(o=>o.fresh=0)}
function adInv(){$('#ab').innerHTML=head('Inventory','Stock, prices and low-stock alerts.')+`<div class="pn">${P.map(p=>`<div class="mrow"><div class="mb" style="--bc:${p.bc}"></div><div style="flex:1"><b>${p.n} ${p.st<12?'<span class="k-pill r">Low stock</span>':''}</b><div class="stk2 ${p.st<12?'lo':''}"><i style="width:${Math.min(100,p.st/80*100)}%"></i></div></div><label style="font-size:12px;color:var(--mut)">Stock<input class="in pi" type="number" min="0" value="${p.st}" data-a="stk" data-i="${p.id}" aria-label="Stock for ${p.n}"></label><label style="font-size:12px;color:var(--mut)">Price<input class="in pi" type="number" min="1" step="0.5" value="${p.p}" data-a="pr" data-i="${p.id}" aria-label="Price for ${p.n}"></label>${p.st<12?`<button class="btn sm" data-a="ro" data-i="${p.id}">Reorder</button>`:''}</div>`).join('')}</div>`}
function adCus(){$('#ab').innerHTML=head('Customers','Your regulars and subscribers.')+`<div class="pn"><div class="k-tw"><table class="k-tbl"><thead><tr><th>Customer</th><th>Orders</th><th>Plan</th><th>Lifetime value</th><th>Next ship</th></tr></thead><tbody>${CUS.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${money(c[3])}</td><td>${c[4]}</td></tr>`).join('')}</tbody></table></div></div>`}
const STM=MON.map((m,i)=>{const g=REV[i],fee=Math.round(g*.029+ORN[i]*.3),ship=Math.round(ORN[i]*4.2),cogs=Math.round(g*.38),rf=Math.round(g*.01),pay=g-fee-rf;return{m:m+(i<1?' 2025':' 2026'),g,fee,ship,cogs,rf,pay,pr:g-fee-ship-cogs-rf,o:ORN[i],cur:i==11}}).reverse();
function adStm(){$('#ab').innerHTML=head('Monthly statements','Revenue, costs and profit for each month.')+`<div class="pn"><div class="k-tw"><table class="k-tbl"><thead><tr><th>Month</th><th>Revenue</th><th>Orders</th><th>Costs</th><th>Profit</th><th>Status</th></tr></thead><tbody>${STM.map((s,i)=>`<tr class="ck" data-a="stm" data-i="${i}"><td><b>${s.m}</b></td><td>${money(s.g)}</td><td>${s.o.toLocaleString()}</td><td>${money(s.g-s.pr)}</td><td><b>${money(s.pr)}</b></td><td><span class="k-pill ${s.cur?'y':'g'}">${s.cur?'In progress':'Closed'}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function stmD(i){const s=STM[i],L=(a,b,c='')=>`<div class="mrow" style="padding:11px 0"><span style="flex:1">${a}</span><b style="font-variant-numeric:tabular-nums">${b}</b></div>`;drawer.open(`<div style="display:flex;align-items:center"><div><h2 style="font-size:32px">${s.m}</h2><span class="k-pill ${s.cur?'y':'g'}">${s.cur?'In progress':'Closed'}</span></div><button class="k-x" data-close aria-label="Close">×</button></div><div>${L('Subscription revenue',money(Math.round(s.g*.46)))}${L('One-time coffee',money(Math.round(s.g*.42)))}${L('Gear',money(Math.round(s.g*.12)))}${L('Refunds','−'+money(s.rf))}${L('Payment fees','−'+money(s.fee))}${L('Shipping labels','−'+money(s.ship))}${L('Green coffee and packaging','−'+money(s.cogs))}<div class="mrow" style="border-top:2px solid var(--plum);font:800 24px Syne"><span style="flex:1">Profit</span><span>${money(s.pr)}</span></div></div><button class="btn m" data-a="pdf" style="margin-top:auto">Download statement</button>`)}
const SUG={Subscriptions:'You can skip or pause any time from the Subscribe page. Skipping takes two taps.',Products:'Thanks for asking. We are restocking this week and will email subscribers first.',Shipping:'Right now we ship within the US. International shipping is coming next year.',Wholesale:'Yes. Email wholesale@sundaybean.demo with your cafe name and we will send samples.'};
function adQ(){const by={};QS.forEach(q=>by[q.cat]=(by[q.cat]||0)+1);const ok=QS.filter(q=>q.ok).length;$('#ab').innerHTML=head('Customer questions','Everything shoppers asked the site assistant.')+`<div class="kp k3"><div class="k"><span>Questions this month</span><b id="q1">0</b></div><div class="k"><span>Answered by the assistant</span><b id="q2">0</b></div><div class="k"><span>Need your input</span><b id="q3" style="color:#C8492B">0</b></div></div><div class="gr g3"><div class="pn"><h3>Top topics</h3><div id="tp"></div></div><div class="pn"><h3>Conversations</h3>${QS.map((q,i)=>`<div class="qi"><div class="q">“${q.q}”</div>${q.ok?`<div class="a">${q.a}</div>`:`<textarea class="in" id="ans${i}" rows="2" placeholder="Type the answer the assistant should give next time."></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn o sm" data-a="sug" data-i="${i}" data-s="${(SUG[q.cat]||SUG.Products).replace(/"/g,'')}">Suggest an answer</button><button class="btn sm" data-a="save" data-i="${i}">Approve and save</button></div>`}<div class="m"><span class="k-pill ${q.ok?'g':'y'}">${q.ok?'Answered':'Needs your input'}</span><span class="k-pill">${q.cat}</span><span>${q.t}</span></div></div>`).join('')}</div></div>`;count($('#q1'),QS.length+214);count($('#q2'),Math.round(ok/QS.length*100),{suf:'%'});count($('#q3'),QS.length-ok);hbars($('#tp'),Object.entries(by).sort((a,b)=>b[1]-a[1]))}
route();
</script></body></html>
