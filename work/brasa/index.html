function head(t,s,extra=''){return `<div class="dm">Demo back office. All numbers are made up. Orders, reservations and questions from the website show up here.</div><div class="hd"><div><h1>${t}</h1><p>${s}</p></div><div class="sp" style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">${extra}<a class="btn o sm" href="#/">View website</a></div></div>`}
function adOverview(){const m=SALES[11],pm=SALES[10],ch=((m/pm-1)*100).toFixed(1);$('#ab').innerHTML=head('Overview','November, month to date')+`<div class="kp"><div class="k"><span>Sales this month</span><b id="k1">0</b><small>▲ ${ch}% vs October</small></div><div class="k"><span>Orders</span><b id="k2">0</b><small>▲ 3.9%</small></div><div class="k"><span>Average ticket</span><b id="k3">0</b><small>▲ 1.2%</small></div><div class="k"><span>Guests seated</span><b id="k4">0</b><small class="dn">▼ 0.8%</small></div></div>
<div class="gr"><div class="pn"><h3>Sales<span class="chips"><button class="chip ${aMode=='m'?'on':''}" data-a="ch" data-m="m">12 months</button><button class="chip ${aMode=='d'?'on':''}" data-a="ch" data-m="d">30 days</button></span></h3><div id="chart"></div></div><div class="pn"><h3>Top dishes</h3><div id="top"></div></div></div>
<div class="gr g2"><div class="pn"><h3>Busiest hours</h3><div class="heat">${HEAT.map((v,i)=>`<i style="--v:${v}" data-t="${(i+11)%12||12}${i+11<24&&i+11>=12?' PM':' AM'}: ${v} orders/hr"></i>`).join('')}</div><div class="hl"><span>11 AM</span><span>Peak 7 to 9 PM</span><span>10 PM</span></div></div><div class="pn"><h3>Where orders come from</h3><div id="src"></div></div></div>`;
count($('#k1'),m,{pre:'$'});count($('#k2'),ORDN[11]+st.orders);count($('#k3'),38.1,{pre:'$',dec:2});count($('#k4'),3912);drawChart();hbars($('#top'),MENU.slice().sort((a,b)=>b.u-a.u).slice(0,6).map(x=>[x.e+' '+x.n,x.u]));hbars($('#src'),[['In person',512],['Online pickup',433],['Delivery',273],['Phone',66]])}
function drawChart(){const c=$('#chart');if(!c)return;if(aMode=='m')bars(c,SALES.map((v,i)=>({l:MON[i],v})),{fmt:v=>money(v),hi:11});else line(c,DL,[{name:'',data:DAILY,color:'#E8480F'}],{fmt:v=>money(v)})}
function adminAct(a,v){if(v=='ch'){aMode=a.dataset.m;$$('.pn .chip').forEach(c=>c.classList.toggle('on',c==a));drawChart()}
else if(v=='stat'){const o=ORD.find(x=>x.n==a.dataset.n);o.s=a.value;toast('Order #'+o.n+' is now '+o.s)}
else if(v=='av'){const m=MENU.find(x=>x.id==a.dataset.i);m.on=m.on?0:1;a.setAttribute('aria-checked',!!m.on);toast(m.n+(m.on?' is back on the menu':' is marked sold out'))}
else if(v=='rs'){const r=RES[+a.dataset.i];r.s=a.dataset.s;adRes();toast('Reservation '+r.s.toLowerCase())}
else if(v=='stm')stmDrawer(+a.dataset.i);else if(v=='pdf')toast('Demo only. In the live version this downloads a PDF.');
else if(v=='save'){const q=QS[+a.dataset.i],t=$('#ans'+a.dataset.i);if(!t.value.trim())return toast('Type an answer first');q.a=t.value.trim();q.ok=true;adQs();confetti(innerWidth/2,300,50);toast('Saved. The assistant will use this answer next time.')}

document.addEventListener('change',e=>{const a=e.target.closest('[data-a="stat"]');if(a)adminAct(a,'stat');if(e.target.dataset.a=='pr'){const m=MENU.find(x=>x.id==e.target.dataset.i);m.p=Math.max(1,+e.target.value||m.p);toast(m.n+' is now '+money(m.p,2))}});
document.addEventListener('click',e=>{const sw=e.target.closest('.k-sw[data-a="av"]');if(sw)adminAct(sw,'av')});
const FN=['Ana','Leo','Sofia','Jon','Mia','Rafa','Zoe','Dev'],FI=['Pollo a la brasa, Cafecito','Churrasco, Maduros','Ceviche mixto, Mojito x2','Garden bowl, Limeade','Empanadas, Key lime pie','Ropa vieja, Guava margarita'];

function renderAdminBadge(){}
function adOrders(){const cols={Received:'b',Cooking:'y',Ready:'g',Done:''};$('#ab').innerHTML=head('Orders','Live from the website, phone and dining room.',`<button class="btn sm" data-a="sim">Simulate new order</button>`)+`<div class="pn"><div class="k-tw"><table class="k-tbl"><thead><tr><th>#</th><th>Guest</th><th>Items</th><th>Type</th><th>Time</th><th>Total</th><th>Status</th></tr></thead><tbody>${ORD.map(o=>`<tr class="${o.fresh?'nw':''}"><td><b>${o.n}</b></td><td>${o.w}<br><small style="color:var(--mut)">${o.src}</small></td><td style="max-width:260px">${o.it}</td><td>${o.typ}</td><td>${o.tm}</td><td>${money(o.t,2)}</td><td><select class="ss" data-a="stat" data-n="${o.n}">${['Received','Cooking','Ready','Done'].map(s=>`<option ${s==o.s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`;ORD.forEach(o=>o.fresh=0)}

const STM=MON.map((m,i)=>{const g=SALES[i],tips=Math.round(g*.17),fee=Math.round(g*.029+ORDN[i]*.3),dl=Math.round(g*.05),ref=Math.round(g*.008),tax=Math.round(g*.07),net=g+tips-fee-dl-ref;return{m:m+(i<1?' 2025':' 2026'),g,tips,fee,dl,ref,tax,net,o:ORDN[i],cur:i==11}}).reverse();
