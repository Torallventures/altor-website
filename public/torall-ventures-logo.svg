<svg xmlns="http://www.w3.org/2000/svg" width="224" height="64" viewBox="280 110 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Torall Ventures</title>
  <desc id="desc">Animated signature in Torall green and gray violet beside the Torall Ventures wordmark.</desc>
  <style>
    .signature { fill: none; stroke: #A4C68A; stroke-linecap: round; stroke-linejoin: round; }
    .signature path { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw .8s ease both; }
    .signature path:nth-child(2) { animation-delay: .65s; }
    .signature path:nth-child(3) { animation-delay: 1.25s; animation-duration: .4s; }
    .signature path:nth-child(4) { animation-delay: 1.6s; animation-duration: .5s; stroke: #777180; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .signature path { animation: none; } }
  </style>
  <g class="signature" transform="translate(120 30) scale(.8)">
    <path d="M411 352 C350 354 286 344 306 301 C327 260 393 204 427 200 C489 188 448 318 430 397 C426 418 460 361 485 320 L558 204 C583 164 594 150 590 181" stroke-width="10" pathLength="1"/>
    <path d="M538 332 C576 320 623 258 648 211 C673 160 638 184 619 229 C602 268 581 334 582 356 C582 381 620 356 649 333 C690 380 823 372 879 349 C897 342 904 334 902 332 C817 331 473 403 358 434" stroke-width="8.5" pathLength="1"/>
    <path d="M525 277 C574 265 664 258 733 254" stroke-width="7" pathLength="1"/>
    <path d="M360 433 C478 409 670 396 814 391 M840 390 L862 388" stroke-width="7.5" pathLength="1"/>
  </g>
  <text x="960" y="280" fill="#A4C68A" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="600" letter-spacing="8">TORALL</text>
  <text x="963" y="365" fill="#777180" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="500" letter-spacing="15">VENTURES</text>
</svg>
